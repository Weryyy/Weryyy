<svg width="900" height="150" viewBox="0 0 900 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Visit my interactive portfolio">
  <defs>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .typing { animation: type-fade 4s ease-in-out infinite; }
      .btn-glow { animation: glow 2.2s ease-in-out infinite; }
      .arrow { animation: nudge 1.4s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
      @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes type-fade { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- terminal window -->
  <rect x="1" y="1" width="898" height="148" rx="12" fill="#16161e" stroke="#2f334d" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="34" rx="12" fill="#24283b"/>
  <rect x="1" y="23" width="898" height="12" fill="#24283b"/>
  <circle cx="24" cy="18" r="6" fill="#f7768e"/>
  <circle cx="44" cy="18" r="6" fill="#e0af68"/>
  <circle cx="64" cy="18" r="6" fill="#9ece6a"/>
  <text class="mono" x="450" y="23" font-size="12" fill="#787c99" text-anchor="middle">hector@homelab: ~ — zsh</text>

  <!-- command line -->
  <text class="mono typing" x="28" y="72" font-size="16">
    <tspan fill="#9ece6a" font-weight="700">λ </tspan><tspan fill="#c0caf5">open</tspan><tspan fill="#7dcfff"> https://weryyy.github.io/posible-web</tspan>
  </text>
  <text class="mono" x="28" y="100" font-size="13" fill="#565f89">→ portfolio interactivo: terminal real + red neuronal + easter eggs</text>
  <rect class="cursor" x="500" y="88" width="8" height="14" fill="#bb9af7"/>

  <!-- button -->
  <rect class="btn-glow" x="610" y="55" width="262" height="56" rx="12" fill="url(#btn-grad)" opacity=".5"/>
  <rect x="616" y="61" width="250" height="44" rx="9" fill="#1a1b26" stroke="url(#btn-grad)" stroke-width="2"/>
  <text class="mono" x="726" y="89" font-size="15" font-weight="700" fill="url(#btn-grad)" text-anchor="middle">ENTER PORTFOLIO</text>
  <g class="arrow">
    <text class="mono" x="836" y="89" font-size="16" font-weight="700" fill="#bb9af7">→</text>
  </g>
</svg>
